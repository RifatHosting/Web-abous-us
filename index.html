<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --bg-color: #f8fafc;
            --glass-border: rgba(255, 255, 255, 0.5);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent; 
            color: #1e293b;
        }
        
        /* Background Mesh Gradient */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, hsla(225,39%,30%,0) 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, hsla(339,49%,30%,0) 50%);
            z-index: -1;
        }
        .mesh-blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }
        .blob-1 { top: -10%; right: -10%; width: 400px; height: 400px; background: #e0e7ff; animation-delay: 0s; }
        .blob-2 { bottom: -10%; left: -10%; width: 300px; height: 300px; background: #f3e8ff; animation-delay: 5s; }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20px, 40px) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 20px -5px rgba(0,0,0,0.05);
        }
        
        /* Animations */
        .page-enter { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .element-pop { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; transform: scale(0.9); }
        
        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translateY(30px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.9); } 
            100% { opacity: 1; transform: scale(1); } 
        }

        /* Utilities */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Interactive */
        .active-press:active { transform: scale(0.97); }
        .nav-item.active { color: #4f46e5; position: relative; }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background: #4f46e5; border-radius: 50%;
        }
    </style>
</head>

    /* DATA_END */

    // --- STATE MANAGEMENT ---
    const DB_KEY = 'learnApp_v2_db';
    
    // Load local progress
    const getLocalData = () => {
        try {
            const data = JSON.parse(localStorage.getItem(DB_KEY));
            if (data) return data;
        } catch (e) {
            console.warn("Resetting corrupt save data");
        }
        return { 
            user: null, 
            completedParts: [], 
            totalScore: 0,
            quizHistory: {} 
        };
    };

    const state = {
        db: getLocalData(),
        route: 'splash',
        activeModuleIdx: 0,
        activePartIdx: 0,
        activeQuizIdx: 0,
        quizScore: 0,
        bannerIndex: 0
    };

    function saveState() {
        localStorage.setItem(DB_KEY, JSON.stringify(state.db));
    }

    // --- ACTIONS ---
    const actions = {
        nav: (route) => {
            state.route = route;
            render();
        },
        login: () => {
            const input = document.getElementById('usernameInput');
            const name = input ? input.value.trim() : "";
            if (!name) return alert("Siapa nama kamu?");
            state.db.user = name;
            saveState();
            actions.nav('home');
        },
        logout: () => {
            if(confirm('Yakin ingin keluar dari akun?')) {
                state.db.user = null;
                saveState();
                state.route = 'splash';
                render();
                setTimeout(() => {
                    if (state.route === 'splash') actions.nav('login');
                }, 1000);
            }
        },
        openModuleDetail: (idx) => {
            state.activeModuleIdx = idx;
            actions.nav('module_detail');
        },
        openPartReader: (partIdx) => {
            state.activePartIdx = partIdx;
            actions.nav('part_reader');
        },
        startQuiz: () => {
            state.activeQuizIdx = 0;
            state.quizScore = 0;
            actions.nav('quiz');
        },
        answerQuiz: (optIdx) => {
            const mod = APP_DATA.modules[state.activeModuleIdx];
            const part = mod.parts[state.activePartIdx];
            const quiz = part.quizzes[state.activeQuizIdx];
            
            // Visual feedback handled in render, logic here
            const btns = document.querySelectorAll('.quiz-opt-btn');
            btns.forEach((btn, idx) => {
                if(idx === quiz.answer) btn.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                else if(idx === optIdx) btn.classList.add('bg-red-100', 'border-red-500', 'text-red-700');
            });

            if (optIdx === quiz.answer) state.quizScore++;
            
            setTimeout(() => {
                state.activeQuizIdx++;
                render();
            }, 800); // Slower delay to see result
        },
        completePart: (scoreFromQuiz = 0) => {
            const partId = `${state.activeModuleIdx}_${state.activePartIdx}`;
            
            if (!state.db.completedParts.includes(partId)) {
                state.db.completedParts.push(partId);
            }
            
            const currentHigh = state.db.quizHistory[partId] || 0;
            if (scoreFromQuiz > currentHigh) {
                state.db.quizHistory[partId] = scoreFromQuiz;
                state.db.totalScore += (scoreFromQuiz - currentHigh) * 10;
            }
            
            saveState();
            actions.nav('module_detail');
        }
    };
    
    window.actions = actions;

    // --- COMPONENTS ---

    // 1. Splash Screen
    const SplashScreen = () => {
        const logoHtml = APP_DATA.appLogo 
            ? `<img src="${APP_DATA.appLogo}" class="w-32 h-32 object-contain mb-6 drop-shadow-xl animate-bounce">`
            : `<div class="w-24 h-24 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-3xl flex items-center justify-center mb-6 shadow-xl shadow-indigo-500/30 ring-4 ring-white"><i class="fas fa-atom text-5xl text-white"></i></div>`;

        return `
        <div class="h-full flex flex-col justify-center items-center p-8 text-center relative overflow-hidden">
            <div class="absolute inset-0 bg-white/40 backdrop-blur-3xl z-0"></div>
            <div class="relative z-10 flex flex-col items-center element-pop" style="animation-delay: 0.1s">
                ${logoHtml}
                <h1 class="text-3xl font-extrabold text-slate-800 mb-2 tracking-tight">${APP_DATA.appTitle}</h1>
                <p class="text-slate-500 font-medium">Tempat belajar masa depan.</p>
            </div>
            <div class="absolute bottom-12 w-full flex justify-center">
                <div class="w-6 h-6 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
            </div>
        </div>
    `};

    // 2. Login
    const LoginScreen = () => `
        <div class="h-full flex flex-col bg-white/60 backdrop-blur-xl relative page-enter">
            <div class="flex-1 flex flex-col px-8 pt-20">
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 mb-6 shadow-sm">
                    <i class="fas fa-hand-sparkles text-2xl"></i>
                </div>
                <h2 class="text-4xl font-extrabold text-slate-800 mb-3 tracking-tight">Selamat<br>Datang!</h2>
                <p class="text-slate-500 text-lg mb-10 leading-relaxed">Ayo mulai perjalanan belajarmu hari ini.</p>
                
                <div class="space-y-6">
                    <div class="group">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Nama Panggilan</label>
                        <div class="bg-white p-1 rounded-2xl shadow-sm border border-slate-200 focus-within:border-indigo-500 focus-within:ring-4 focus-within:ring-indigo-500/10 transition-all duration-300">
                            <input id="usernameInput" type="text" class="w-full bg-transparent px-4 py-3 text-lg font-semibold text-slate-800 placeholder-slate-300 outline-none" placeholder="Tulis namamu..." autocomplete="off">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="p-8 pb-10">
                <button onclick="window.actions.login()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-600/30 active:scale-95 transition-transform duration-200 flex items-center justify-center text-lg">
                    <span>Mulai Belajar</span>
                    <i class="fas fa-arrow-right ml-2 text-sm opacity-80"></i>
                </button>
            </div>
        </div>
    `;

    // 3. Home
    const HomeScreen = () => {
        const user = state.db.user || "Tamu";
        const modules = APP_DATA.modules || [];
        
        // Avatar
        const headerIcon = APP_DATA.appLogo
            ? `<img src="${APP_DATA.appLogo}" class="w-12 h-12 rounded-full border-2 border-white shadow-md bg-white object-contain">`
            : `<div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-full flex items-center justify-center text-white font-bold border-2 border-white shadow-md text-xl">${user.charAt(0).toUpperCase()}</div>`;

        // Banners
        let bannerHTML = '';
        if (APP_DATA.banners && APP_DATA.banners.length > 0) {
            const currentBanner = APP_DATA.banners[state.bannerIndex % APP_DATA.banners.length];
            
            let dotsHTML = '';
            if (APP_DATA.banners.length > 1) {
                const dots = APP_DATA.banners.map((_, i) => {
                    const width = i === state.bannerIndex ? 'w-6 bg-white' : 'w-1.5 bg-white/50';
                    return `<div class="h-1.5 rounded-full transition-all duration-300 ${width}"></div>`;
                }).join('');
                dotsHTML = '<div id="banner-dots" class="absolute bottom-4 left-4 flex gap-1.5">' + dots + '</div>';
            }

            bannerHTML = `
                <div class="mt-8 relative h-48 w-full overflow-hidden rounded-[2rem] shadow-lg shadow-indigo-900/10 group transform transition-all hover:scale-[1.01]">
                    <img id="banner-img" src="${currentBanner}" class="w-full h-full object-cover" alt="Banner">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                    ${dotsHTML}
                </div>
            `;
        }

        // Modules Grid
        let modulesHTML = "";
        if (modules.length === 0) {
            modulesHTML = `
                <div class="col-span-2 flex flex-col items-center justify-center py-12 opacity-40">
                    <div class="w-20 h-20 bg-slate-200 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-box-open text-3xl text-slate-400"></i>
                    </div>
                    <p class="font-medium text-slate-500">Materi belum tersedia.</p>
                </div>
            `;
        } else {
            modulesHTML = modules.map((mod, idx) => {
                const totalParts = mod.parts.length;
                const completedCount = mod.parts.filter((_, pIdx) => state.db.completedParts.includes(`${idx}_${pIdx}`)).length;
                const progress = totalParts > 0 ? Math.round((completedCount / totalParts) * 100) : 0;
                
                const bgStyle = mod.coverImage 
                    ? `background-image: url('${mod.coverImage}');` 
                    : `background: linear-gradient(135deg, #6366f1, #a855f7);`;

                return `
                <div onclick="window.actions.openModuleDetail(${idx})" class="glass-card rounded-[1.5rem] p-3 cursor-pointer active-press transition-all duration-300 hover:-translate-y-1 element-pop" style="animation-delay: ${idx * 0.1}s">
                    <div class="h-28 rounded-2xl bg-cover bg-center mb-3 relative overflow-hidden shadow-inner" style="${bgStyle}">
                        <div class="absolute inset-0 bg-black/10"></div>
                        <div class="absolute top-2 right-2 bg-white/90 backdrop-blur text-[10px] font-bold px-2 py-0.5 rounded-full text-indigo-900 shadow-sm">
                            ${mod.parts.length} BAB
                        </div>
                    </div>
                    <div class="px-1 mb-2">
                        <h3 class="text-base font-bold text-slate-800 leading-tight mb-1 line-clamp-2">${mod.title}</h3>
                        <p class="text-[10px] text-slate-500 line-clamp-1 mb-3">${mod.desc}</p>
                        
                        <div class="flex items-center gap-2">
                             <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full bg-indigo-500 rounded-full" style="width: ${progress}%"></div>
                             </div>
                             <span class="text-[10px] font-bold text-indigo-500">${progress}%</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // Stats Row
        const statsHtml = `
            <div class="flex gap-4 mt-6 overflow-x-auto hide-scrollbar pb-2">
                <div class="bg-white p-3 pr-6 rounded-2xl shadow-sm border border-slate-100 flex items-center min-w-max">
                    <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 mr-3">
                        <i class="fas fa-star"></i>
                    </div>
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-400">Total Poin</div>
                        <div class="text-lg font-bold text-slate-800">${state.db.totalScore}</div>
                    </div>
                </div>
                <div class="bg-white p-3 pr-6 rounded-2xl shadow-sm border border-slate-100 flex items-center min-w-max">
                    <div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-500 mr-3">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-400">Selesai</div>
                        <div class="text-lg font-bold text-slate-800">${state.db.completedParts.length} Bab</div>
                    </div>
                </div>
            </div>
        `;

        return `
            <div class="h-full flex flex-col page-enter relative">
                <!-- Header -->
                <div class="px-6 pt-8 pb-4 sticky top-0 z-30 bg-[#f1f5f9]/80 backdrop-blur-md border-b border-white/50">
                    <div class="flex justify-between items-center">
                        <div class="flex flex-col">
                            <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-0.5">Hai, ${user}</span>
                            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Mau belajar apa?</h1>
                        </div>
                        ${headerIcon}
                    </div>
                </div>

                <!-- Scrollable Content -->
                <div class="flex-1 overflow-y-auto px-6 pb-28 hide-scrollbar">
                    ${bannerHTML}
                    ${statsHtml}

                    <div class="mt-8">
                        <div class="flex justify-between items-end mb-4">
                            <h2 class="font-bold text-slate-800 text-lg">Materi Pilihan</h2>
                            <span class="text-xs text-indigo-500 font-semibold cursor-pointer">Lihat Semua</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${modulesHTML}
                        </div>
                    </div>
                </div>
                ${BottomNav('home')}
            </div>
        `;
    };

    // 4. Module Detail
    const ModuleDetailScreen = () => {
        const mod = APP_DATA.modules[state.activeModuleIdx];
        if(!mod) return actions.nav('home');
        
        const partsHTML = mod.parts.map((part, pIdx) => {
            const partId = `${state.activeModuleIdx}_${pIdx}`;
            const isDone = state.db.completedParts.includes(partId);
            const score = state.db.quizHistory[partId];

            return `
                <div onclick="window.actions.openPartReader(${pIdx})" class="group relative flex items-center p-4 bg-white rounded-2xl mb-3 border ${isDone ? 'border-emerald-100 bg-emerald-50/20' : 'border-white shadow-sm'} active-press cursor-pointer transition-all hover:shadow-md element-pop" style="animation-delay: ${pIdx * 0.05}s">
                    <div class="absolute left-6 top-0 bottom-0 w-0.5 bg-slate-100 -z-10 group-last:hidden"></div>
                    
                    <div class="w-12 h-12 rounded-2xl ${isDone ? 'bg-emerald-500 text-white shadow-emerald-200' : 'bg-white border border-slate-100 text-slate-400'} shadow-lg flex items-center justify-center font-bold mr-5 shrink-0 text-sm z-10 transition-colors">
                        ${isDone ? '<i class="fas fa-check"></i>' : pIdx + 1}
                    </div>
                    <div class="flex-1 py-1">
                        <h4 class="font-bold text-slate-800 text-base mb-1 group-hover:text-indigo-600 transition">${part.title}</h4>
                        <div class="flex gap-3 text-[11px] font-medium text-slate-400">
                           <span class="flex items-center"><i class="fas fa-book-open mr-1.5 opacity-70"></i>Bacaan</span>
                           ${part.quizzes.length > 0 ? `<span class="flex items-center"><i class="fas fa-brain mr-1.5 opacity-70"></i>Kuis</span>` : ''}
                        </div>
                    </div>
                    ${score !== undefined ? `<div class="flex flex-col items-end"><span class="text-xs font-bold text-orange-500">⭐ ${score}</span></div>` : '<i class="fas fa-chevron-right text-slate-300 text-xs"></i>'}
                </div>
            `;
        }).join('');

        return `
            <div class="h-full flex flex-col bg-[#f8fafc] page-enter">
                <!-- Immersive Header -->
                <div class="h-64 relative flex-shrink-0">
                     <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('${mod.coverImage || ''}'); background-color: #6366f1;"></div>
                     <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-[#f8fafc]"></div>
                     
                     <div class="absolute top-0 left-0 w-full p-6 pt-10 flex items-start justify-between z-20">
                        <button onclick="window.actions.nav('home')" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white hover:text-slate-900 transition shadow-lg border border-white/20">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                     </div>

                     <div class="absolute bottom-0 left-0 w-full p-6 z-10">
                        <span class="bg-indigo-600 text-white text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider mb-3 inline-block shadow-lg shadow-indigo-500/30">Modul Belajar</span>
                        <h1 class="text-3xl font-extrabold text-slate-900 leading-tight mb-2 drop-shadow-sm">${mod.title}</h1>
                     </div>
                </div>

                <div class="flex-1 overflow-y-auto px-6 pb-10 hide-scrollbar relative">
                    <div class="mb-8 text-slate-500 text-sm leading-relaxed font-medium">${mod.desc}</div>
                    
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-800 text-lg">Daftar Materi</h3>
                        <span class="text-xs font-bold text-slate-400">${mod.parts.length} Bagian</span>
                    </div>
                    
                    <div class="pb-10">
                        ${partsHTML}
                    </div>
                </div>
            </div>
        `;
    };

    // 5. Part Reader
    const PartReaderScreen = () => {
        const mod = APP_DATA.modules[state.activeModuleIdx];
        const part = mod.parts[state.activePartIdx];
        if(!part) return actions.nav('module_detail');
        
        const contentHTML = part.blocks.map(block => {
            if (block.type === 'text') {
                return `<div class="prose prose-slate text-slate-600 mb-8 leading-8 text-[1.05rem] font-normal">${block.content}</div>`;
            } else if (block.type === 'image') {
                return `<div class="mb-8 rounded-2xl overflow-hidden shadow-lg border border-slate-100"><img src="${block.content}" class="w-full object-cover" loading="lazy"></div>`;
            }
            return '';
        }).join('');

        return `
            <div class="h-full flex flex-col bg-white page-enter">
                <div class="px-6 pt-10 pb-4 border-b border-slate-50 flex items-center justify-between sticky top-0 bg-white/90 backdrop-blur-xl z-20">
                     <button onclick="window.actions.openModuleDetail(${state.activeModuleIdx})" class="w-10 h-10 rounded-full bg-slate-50 hover:bg-slate-100 border border-slate-100 flex items-center justify-center text-slate-600 transition">
                        <i class="fas fa-arrow-left"></i>
                     </button>
                     <div class="flex flex-col items-center">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Materi ${state.activePartIdx + 1}</span>
                        <h3 class="font-bold text-slate-800 text-sm truncate max-w-[180px]">${part.title}</h3>
                     </div>
                     <div class="w-10"></div>
                </div>

                <div class="flex-1 overflow-y-auto px-6 py-8 hide-scrollbar max-w-xl mx-auto w-full">
                    ${contentHTML}
                    
                    <div class="mt-12 p-6 bg-indigo-50 rounded-3xl text-center border border-indigo-100">
                        <h3 class="font-bold text-indigo-900 mb-2 text-lg">Materi Selesai!</h3>
                        <p class="text-indigo-600/70 text-sm mb-6">Siap menguji pemahamanmu?</p>
                        
                        ${part.quizzes && part.quizzes.length > 0 ? `
                            <button onclick="window.actions.startQuiz()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-600/20 active:scale-95 transition flex items-center justify-center">
                                <span>Lanjut ke Kuis</span>
                                <i class="fas fa-arrow-right ml-2"></i>
                            </button>
                        ` : `
                            <button onclick="window.actions.completePart()" class="w-full bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/20 active:scale-95 transition">
                                <i class="fas fa-check mr-2"></i> Tandai Selesai
                            </button>
                        `}
                    </div>
                </div>
            </div>
        `;
    };

    // 6. Quiz
    const QuizScreen = () => {
        const mod = APP_DATA.modules[state.activeModuleIdx];
        const part = mod.parts[state.activePartIdx];
        const quiz = part.quizzes[state.activeQuizIdx];
        
        if (!quiz) {
            const totalQ = part.quizzes.length;
            const score = state.quizScore;
            const percentage = totalQ > 0 ? Math.round((score / totalQ) * 100) : 100;
            const passed = percentage >= 70;

            return `
                <div class="h-full flex flex-col justify-center items-center p-8 bg-white/95 page-enter text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b ${passed ? 'from-emerald-50' : 'from-orange-50'} to-transparent -z-10"></div>
                    
                    <div class="w-32 h-32 ${passed ? 'bg-emerald-100 text-emerald-500 ring-emerald-200' : 'bg-orange-100 text-orange-500 ring-orange-200'} rounded-[2rem] ring-8 flex items-center justify-center mb-8 text-5xl shadow-xl element-pop">
                        <i class="fas ${passed ? 'fa-trophy' : 'fa-book-reader'}"></i>
                    </div>
                    
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-2 tracking-tight">${passed ? 'Hebat Sekali!' : 'Coba Lagi Yuk'}</h2>
                    <p class="text-slate-500 mb-10 max-w-[250px] mx-auto">Kamu berhasil menjawab <strong class="text-slate-800">${score}</strong> dari <strong class="text-slate-800">${totalQ}</strong> soal dengan benar.</p>
                    
                    <div class="w-full space-y-3">
                        <button onclick="window.actions.completePart(${score})" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl shadow-xl active:scale-95 transition">
                            Simpan Progres
                        </button>
                        <button onclick="window.actions.startQuiz()" class="w-full bg-white text-slate-600 font-bold py-4 rounded-2xl border border-slate-200 hover:bg-slate-50 active:scale-95 transition">
                            Ulangi Kuis
                        </button>
                    </div>
                </div>
            `;
        }

        const progressPercent = ((state.activeQuizIdx) / part.quizzes.length) * 100;

        return `
            <div class="h-full flex flex-col bg-[#f8fafc]">
                <!-- Quiz Header -->
                <div class="bg-white px-6 pt-12 pb-6 shadow-sm rounded-b-[2rem] z-10">
                    <div class="flex justify-between items-center mb-6">
                        <button class="w-10 h-10 rounded-full border border-slate-100 bg-white flex items-center justify-center text-slate-400" disabled>
                            <i class="fas fa-times"></i>
                        </button>
                        <div class="flex flex-col items-center">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Kuis</span>
                            <span class="font-extrabold text-indigo-600 text-lg">${state.activeQuizIdx + 1} <span class="text-slate-300 text-sm font-medium">/ ${part.quizzes.length}</span></span>
                        </div>
                        <div class="w-10"></div>
                    </div>
                    <div class="h-3 w-full bg-slate-100 rounded-full overflow-hidden p-0.5">
                        <div class="h-full bg-gradient-to-r from-indigo-500 to-violet-500 rounded-full transition-all duration-500 shadow-sm" style="width: ${progressPercent}%"></div>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto p-6 flex flex-col justify-center">
                    <div class="mb-8 page-enter">
                        <h3 class="text-2xl font-bold text-slate-800 leading-snug">${quiz.question}</h3>
                    </div>

                    <div class="space-y-3">
                        ${quiz.options.map((opt, idx) => `
                            <button onclick="window.actions.answerQuiz(${idx})" class="quiz-opt-btn w-full text-left p-5 bg-white border border-slate-100 hover:border-indigo-400 rounded-2xl shadow-sm font-semibold text-slate-600 transition-all active:scale-[0.98] group flex items-center element-pop" style="animation-delay: ${idx * 0.1}s">
                                <div class="w-8 h-8 rounded-lg bg-slate-50 text-slate-500 text-sm font-bold flex items-center justify-center mr-4 group-hover:bg-indigo-500 group-hover:text-white transition">
                                    ${String.fromCharCode(65 + idx)}
                                </div>
                                <span class="flex-1 leading-snug">${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    // 7. Profile
    const ProfileScreen = () => {
        const { user, completedParts, totalScore } = state.db;
        
        let totalAppParts = 0;
        if(APP_DATA.modules) APP_DATA.modules.forEach(m => totalAppParts += m.parts.length);
        
        const completionRate = totalAppParts > 0 ? Math.round((completedParts.length / totalAppParts) * 100) : 0;

        const logoIcon = APP_DATA.appLogo 
            ? `<img src="${APP_DATA.appLogo}" class="w-28 h-28 mx-auto rounded-[2rem] object-contain bg-white shadow-xl mb-6 ring-4 ring-white">`
            : `<div class="w-28 h-28 mx-auto bg-gradient-to-tr from-indigo-500 to-fuchsia-600 rounded-[2rem] flex items-center justify-center text-5xl font-bold text-white mb-6 shadow-xl shadow-indigo-500/30 ring-4 ring-white">${user ? user.charAt(0).toUpperCase() : '?'}</div>`;

        return `
            <div class="h-full flex flex-col page-enter">
                <div class="relative px-6 pt-12 pb-8 text-center bg-white/50 backdrop-blur-sm z-10">
                    ${logoIcon}
                    <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight mb-1">${user}</h2>
                    <span class="bg-indigo-100 text-indigo-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Pelajar</span>
                </div>

                <div class="flex-1 overflow-y-auto px-6 pb-28 hide-scrollbar">
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="glass-card p-5 rounded-2xl flex flex-col items-center">
                            <span class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-600 to-violet-600 mb-1">${totalScore}</span>
                            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Poin</span>
                        </div>
                        <div class="glass-card p-5 rounded-2xl flex flex-col items-center">
                            <span class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-br from-emerald-500 to-teal-500 mb-1">${completedParts.length}</span>
                            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Bab Selesai</span>
                        </div>
                    </div>

                    <div class="bg-slate-900 rounded-[2rem] p-6 text-white shadow-xl shadow-slate-900/20 mb-6 relative overflow-hidden group">
                        <div class="absolute -right-10 -top-10 w-40 h-40 bg-indigo-500/20 rounded-full blur-3xl group-hover:bg-indigo-500/30 transition"></div>
                        
                        <div class="relative z-10">
                            <div class="flex justify-between items-end mb-4">
                                <div>
                                    <h3 class="font-bold text-lg mb-1">Progres Global</h3>
                                    <p class="text-slate-400 text-xs">Jalanmu masih panjang!</p>
                                </div>
                                <span class="text-2xl font-bold text-indigo-400">${completionRate}%</span>
                            </div>
                            
                            <div class="h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                <div class="h-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 transition-all duration-1000" style="width: ${completionRate}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <button onclick="window.actions.logout()" class="w-full bg-white border border-red-100 text-red-500 font-bold py-4 rounded-2xl hover:bg-red-50 transition shadow-sm active:scale-95">
                            Keluar Akun
                        </button>
                    </div>
                    
                    <div class="mt-8 text-center">
                         <p class="text-[10px] text-slate-300 font-medium">LearnApp v3.0 • Designed with ❤</p>
                    </div>
                </div>

                ${BottomNav('profile')}
            </div>
        `;
    };

    const BottomNav = (active) => `
        <div class="absolute bottom-8 left-8 right-8 h-[70px] glass rounded-[2rem] shadow-2xl flex justify-around items-center z-40 px-2 ring-1 ring-white/50">
            <button onclick="window.actions.nav('home')" class="nav-item relative w-16 h-16 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 ${active === 'home' ? 'active' : 'text-slate-400 hover:text-slate-600'}">
                <i class="fas fa-home text-2xl mb-1 transition-transform ${active === 'home' ? 'scale-110' : ''}"></i>
            </button>
            <div class="w-[1px] h-8 bg-slate-200"></div>
            <button onclick="window.actions.nav('profile')" class="nav-item relative w-16 h-16 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 ${active === 'profile' ? 'active' : 'text-slate-400 hover:text-slate-600'}">
                <i class="fas fa-user text-2xl mb-1 transition-transform ${active === 'profile' ? 'scale-110' : ''}"></i>
            </button>
        </div>
    `;

    // --- RENDER LOOP ---
    setInterval(() => {
        if (state.route === 'home' && APP_DATA.banners && APP_DATA.banners.length > 1) {
            state.bannerIndex = (state.bannerIndex + 1) % APP_DATA.banners.length;
            
            const imgEl = document.getElementById('banner-img');
            const dotsContainer = document.getElementById('banner-dots');
            
            if (imgEl) {
                imgEl.classList.add('opacity-50', 'scale-95');
                setTimeout(() => {
                    imgEl.src = APP_DATA.banners[state.bannerIndex];
                    imgEl.classList.remove('opacity-50', 'scale-95');
                }, 300);
            }
            
            if (dotsContainer) {
                 let dotsHTML = '';
                 for (let i = 0; i < APP_DATA.banners.length; i++) {
                     const width = i === state.bannerIndex ? 'w-6 bg-white' : 'w-1.5 bg-white/50';
                     dotsHTML += '<div class="h-1.5 rounded-full transition-all duration-300 ' + width + '"></div>';
                 }
                 dotsContainer.innerHTML = dotsHTML;
            }
        }
    }, 5000);

    function render() {
        const root = document.getElementById('root');
        if (!root) return;
        
        try {
            switch(state.route) {
                case 'splash': root.innerHTML = SplashScreen(); break;
                case 'login': root.innerHTML = LoginScreen(); break;
                case 'home': root.innerHTML = HomeScreen(); break;
                case 'module_detail': root.innerHTML = ModuleDetailScreen(); break;
                case 'part_reader': root.innerHTML = PartReaderScreen(); break;
                case 'quiz': root.innerHTML = QuizScreen(); break;
                case 'profile': root.innerHTML = ProfileScreen(); break;
                default: root.innerHTML = HomeScreen();
            }
        } catch (e) {
            console.error("Render error:", e);
            root.innerHTML = '<div class="h-full flex flex-col justify-center items-center text-center p-8"><i class="fas fa-bug text-4xl text-slate-300 mb-4"></i><p class="text-slate-500">Terjadi kesalahan.</p><button onclick="window.location.reload()" class="mt-4 text-indigo-500 font-bold">Muat Ulang</button></div>';
        }
    }

    window.onload = () => {
        render();
        setTimeout(() => {
            if (state.route === 'splash') {
                actions.nav(state.db.user ? 'home' : 'login');
            }
        }, 2500);
    };
</script>
</body>
</html>
